# entry.ghostlock@6.6 — GhostLock entry, android15-6.6 variant.
#
#   android15-6.6 targets (mustang/rango/blazer/frankel) compile the same
#   sources as 6.1, with the pselect main route. What differs between the two
#   interfaces is selected by -DLIB_KMI in common.h rather than by a separate
#   copy of each file.
#
# `facts.forbids` below makes a 6.1 target header a build error against this
# stage (ARCH-G3-FACTS in runner/scripts/resolve-recipe.py).

schema = 1
kind   = "entry"
id     = "entry.ghostlock@6.6"
cve    = "CVE-2026-43499"
kmi    = ["android15-6.6"]


# Composed: driven end to end by ./pixel-ksu-root.
composed = true
# The fake file_operations page's leak+groom goes through
# cves/lib/spray/crosscache's `stream` method rather than this chain's own
# copy of that sequence (util.c); same shaping pool sizes, same close-loop
# bounds, same socket type.
status   = "composed, hardware verification owed: both the fake-fops leak and pipe.c's own R/W-primitive leak go through lib/spray/crosscache (stream method); pipe.c's own pipe-cache shape/drain/reclaim step is unchanged"

[build]
form    = "preload-so"          # dlopen'ed by cve-helper --run-payload
entry   = "constructor"         # preload.c ctor -> run_exploit()
# Order is load-bearing: it fixes STT_FILE order and .rodata string-merge
# order, and therefore the output bytes.  Do not sort this list.
sources = [
  "cves/cve-2026-43499-ghostlock/main.c",
  "cves/cve-2026-43499-ghostlock/util.c",
  "cves/cve-2026-43499-ghostlock/util_addr.c",
  "cves/lib/rw/nameblob.c",
  "cves/lib/kaslr/slide_tracefs.c",
  "cves/cve-2026-43499-ghostlock/fops.c",
  "cves/cve-2026-43499-ghostlock/pipe.c",
  "cves/cve-2026-43499-ghostlock/pipe_rw.c",
  "cves/lib/rw/pipe_rw.c",
  "cves/lib/spray/crosscache/crosscache.c",
  "cves/cve-2026-43499-ghostlock/root.c",
  "cves/lib/root/cred.c",
  "cves/lib/root/taskscan.c",
  "cves/lib/root/handoff.c",
  "cves/cve-2026-43499-ghostlock/preload.c",
]
# -I order is load-bearing too: a quoted #include resolves against the
# INCLUDING FILE's directory first, so each TU in cves/cve-2026-43499-ghostlock/
# picks up that directory's common.h.  See the note in entry.ghostlock@6.1.
includes = ["cves/cve-2026-43499-ghostlock", "cves"]
depends  = ["cves/cve-2026-43499-ghostlock/common.h", "cves/lib/leak/kernelsnitch/*.h",
            "cves/lib/spray/crosscache/crosscache.h"]
# LIB_KMI=66 is LOAD-BEARING: the shared cves/lib/leak/kernelsnitch fork defaults
# to 61 (rounded futex-hash sizing). Omitting this would silently size the 6.6
# futex mask with the 6.1 rounding and the mm_struct bruteforce would miss.
defines  = ["APP_PAYLOAD=1", "LIB_KMI=66"]
# @OPT@ is substituted with `opt` below.  The app and release variants share one
# flag list.
# -include offset.h feeds the device target header (via TARGET_CONFIG_H) to the
# shared lib TUs (cves/lib/root/cred.c, cves/lib/root/taskscan.c), which carry no
# common.h include of their own and would otherwise fall back to panther offsets.
# It is byte-neutral for the GhostLock TUs: they include common.h -> offset.h ->
# target.h, and target.h is OFFSET_H-guarded, so the second inclusion is empty.
cflags   = ["-include", "offset.h", "-fPIC", "@OPT@", "-Wall", "-Wextra", "-Wno-unused-parameter", "-Wno-sign-compare"]
opt      = ["-O2", "-g0"]
ldflags  = ["-shared", "-pthread", "-Wl,--no-undefined"]
output   = "cve-2026-43499-ghostlock"

# The artifact runner/scripts/build-payloads.sh actually ships.
[build.release]
opt     = ["-Oz", "-g0", "-fno-unwind-tables", "-fno-asynchronous-unwind-tables",
           "-ffunction-sections", "-fdata-sections"]
ldflags = ["-shared", "-pthread", "-Wl,--gc-sections", "-Wl,--icf=all", "-s", "-Wl,--no-undefined"]
output  = "cve-2026-43499-ghostlock.release"

[facts]
header = "cves/targets/{target}/target.h"
# Consumed by this source set; absence is a build error, not a link error.
requires = [
  "OFFSET_H", "BUILD_VARIANT_LABEL", "BUILD_FINGERPRINT",
  "INIT_TASK", "INIT_TASK_OFF",
  "ASHMEM_MISC_FOPS", "ASHMEM_MISC_FOPS_OFF", "ASHMEM_FOPS", "ASHMEM_IOCTL",
  "KMALLOC_CACHES", "KMALLOC_CACHES_OFF",
  "P0_PAGE_OFFSET", "P0_PHYS_OFFSET", "P0_KERNEL_PHYS_LOAD", "KIMAGE_TEXT_BASE",
  "PIPE_BUFFER_SIZE", "PIPE_BUFFER_SLOTS",
  "SLIDE_INIT_TASK_IMAGE", "SLIDE_LOGGERS_0_1_IMAGE", "SLIDE_SYSCTL_BOOTID_IMAGE",
  "TASK_CRED_OFF", "TASK_REAL_CRED_OFF", "CRED_UID_OFF",
  "SELINUX_ENFORCING", "SECURITY_HOOK_HEADS",
]
# This source set knows nothing of the route and vehicle facts the other
# interface carries; a description defining them is the wrong one for it.
# Which interface a target is remains ARCH-G9-XSRC's question, answered by the
# interface header's own marker.
forbids = ["PSELECT_WAITER_WORD_SHIFT", "RECLAIM_VEHICLE_DEFAULT"]

# panic_risk is indexed by (stage, request phase).
[properties]
retry_safe  = true
# post_slide is "low", not "none": this stage can panic the phone after the run
# has finished. misc_open() COPIES ashmem_miscs[0].fops into every struct file
# opened while it is forged, and the page behind that pointer dies with the
# payload process, so each such file carries a stale f_op that faults on its
# next touch. Bounding the window is the mitigation -- the restore runs before
# install_child_root, and the route-page-N and fops-restored step markers
# measure what is left. Signatures and the outstanding fix:
# cves/cve-2026-43499-ghostlock/README.md, "Collateral".
panic_risk  = { pre_slide = "high", post_slide = "low" }
destructive = ["slide_logger_parent_slot", "ashmem_miscs[0].fops"]
# restore_fops_ptr_and_owner puts the slot back and zeroes the fake owner word
# so fops_put() survives. It does not reach struct files already holding the
# fake pointer; that damage outlives the run and this stage cannot undo it.
restores    = ["repair_logger_slot", "restore_fops_ptr_and_owner"]
provides    = ["CAP_SLIDE", "CAP_KRW_C"]
requires_caps = []
retains     = ["CAP_KRW_C"]   # the bridge must stay open for fast R/W

# ---------------------------------------------------------------------------
# The runner contract — runner/README.md, "Foreign-chain contract"
# ---------------------------------------------------------------------------
# The four tables below restate runner/lib/exploit.sh's built-in defaults as
# data.  ./pixel-ksu-root with no --recipe reads no manifest; `--recipe
# ghostlock` reads this block.

[invoke]
# A .so dlopen'ed by `cve-helper --run-payload`
# (cves/cve-2026-43499-ghostlock/su_daemon.c:975-1026, dispatched at :1028).
kind = "helper-preload"

# The payload the runner pushes is a prebuilt .so chosen out of
# artifacts/exploits/ by runner/lib/select.sh from data/targets.json — a device
# can resolve to a payload built for a different codename on the same kernel.
artifact_source = "runner"
dest = "/data/local/tmp/exploit-payload.so"
mode = "755"

# Generated from the _INVOKE_TMPL_DEFAULT literal in runner/lib/exploit.sh.
command = "cd @DEV_TMP@; @KASLR_ENV@RMG_CLIENT_UID=@CLIENT_UID@ RMG_APP_UID=@APP_UID@        @DEV_HELPER@ --run-payload @DEV_PAYLOAD@ @DEV_HELPER@ @DEV_LOG@ >/dev/null 2>&1"

# A base cached for the current boot is replayed through @KASLR_ENV@
# (cves/cve-2026-43499-ghostlock/main.c:191-197).
accepts_base = true

# The default MARK_* set of runner/lib/exploit.sh, as data.  The live classes for
# GhostLock are PANIC, REFUSED, PASS, MISS and PARKED; the classifier is driven
# by these patterns.
[markers]
pass         = 'slide-kaslr-tracefs-ok pid=[0-9]+ base=[0-9a-f]+'
gate_fail    = '[A-Z][A-Z0-9_]*_GATE_FAIL'
restore_pass = '[A-Z][A-Z0-9_]*_RESTORE_PASS'
restore_bad  = '[A-Z][A-Z0-9_]*_(RESTORE_NOT_PROVEN|RESTORE_UNREACHABLE|RESTORE_FAIL)'
# Declared so the kill gate stays correct.  Absent, a deadline parks.
heartbeat    = '[A-Z][A-Z0-9_]*_HEARTBEAT[[:space:]]+seq=[0-9]+'
# The route summary discriminates "reached root" from "did not"; the count is
# cfi-miss LINES, one per page that took a miss.
diag         = '(tcp|pselect) route done=[0-9]+.*'
diag_count   = 'cfi misses=[0-9]+'

# Empty: cve-helper's early bails return `errno ? errno : <fixed>`
# (cves/cve-2026-43499-ghostlock/su_daemon.c:1000-1010), so no exit status of
# this loader carries an outcome.
[exit_map]

# The KASLR base, from the `pass` marker above.
[provides]
caps  = ["CAP_SLIDE", "CAP_KRW_C"]
field = 'base=[0-9a-f]+'
label = "base"

# Setup, run before each shot. GhostLock's reclaim race is far easier on a
# freshly booted device, so its one setup step is a reboot to a clean boot.
[[setup]]
reboot = true
